name: test-and-security

on:
  push:
  pull_request:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DJANGO_SECRET_KEY: ci-only-secret-key-that-is-never-used-outside-tests-123456789
      DJANGO_ENV: test
      AUDIT_TEST_DATABASE_URL: postgresql://audit:audit-test-only@127.0.0.1:5432/tms_audit
      AUDIT_TEST_REDIS_URL: redis://127.0.0.1:6379/15

    services:
      postgres:
        image: postgres@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: audit-test-only
          POSTGRES_DB: tms_audit
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U audit -d tms_audit"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis@sha256:e7723ff73d963f5cc6d9c4643ea3d989527a402a319239054e9472a7fb9219a2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.14.10"
          cache: pip

      - name: Install locked dependencies
        run: |
          python -m pip install pip==26.2.1
          python -m pip install --require-hashes -r requirements-dev.txt

      - name: Validate dependency graph
        run: python -m pip check

      - name: Test
        run: coverage run manage.py test --settings=task_management_system.settings_test -v 1

      - name: Report coverage
        run: coverage report --show-missing --fail-under=80

      - name: Validate migrations and API schema
        run: |
          python manage.py makemigrations --check --dry-run --settings=task_management_system.settings_test
          python manage.py spectacular --validate --fail-on-warn --file schema.yml --settings=task_management_system.settings_test

      - name: Django production security checks
        env:
          DJANGO_ENV: production
          DEBUG: "False"
          ALLOWED_HOSTS: example.com
          DATABASE_URL: postgresql://audit:audit@127.0.0.1/audit
          REDIS_URL: rediss://127.0.0.1:6380/0
          REDIS_BROKER_URL: rediss://127.0.0.1:6380/0
          REDIS_RESULT_BACKEND: rediss://127.0.0.1:6380/1
          REDIS_CACHE_BACKEND: rediss://127.0.0.1:6380/2
          CSRF_TRUSTED_ORIGINS: https://example.com
        run: python manage.py check --deploy --fail-level WARNING

      - name: Static security analysis
        run: >-
          bandit -r analytics notifications projects task_management_system tasks users
          -x "*/migrations/*,*/tests.py,*/tests_*.py"

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt --no-deps
      - name: Development tools vulnerability audit
        run: pip-audit -r requirements-dev.txt --no-deps
