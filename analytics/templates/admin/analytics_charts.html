{% extends "admin/base_site.html" %}

{% block content %}
<h1>Project analytics</h1>

<label for="metric">Metric:</label>
<select id="metric">
    <option value="total_tasks">Total tasks</option>
    <option value="completed_tasks">Completed tasks</option>
    <option value="in_progress_tasks">In-progress tasks</option>
    <option value="pending_tasks">Pending tasks</option>
</select>

<div style="width: 100%; max-width: 1200px; margin: 1rem auto; overflow-x: auto;">
    <canvas id="analyticsChart" width="1200" height="520" aria-label="Project task totals"></canvas>
</div>

{{ data|json_script:"analytics-data" }}
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const data = JSON.parse(document.getElementById("analytics-data").textContent);
        const canvas = document.getElementById("analyticsChart");
        const context = canvas.getContext("2d");
        const selector = document.getElementById("metric");
        const colors = ["#2563eb", "#16a34a", "#ca8a04", "#dc2626"];

        function render(metric) {
            const values = data[metric] || [];
            context.clearRect(0, 0, canvas.width, canvas.height);
            context.font = "14px sans-serif";
            context.fillStyle = "#111827";

            if (!data.labels.length) {
                context.fillText("No analytics data available.", 30, 40);
                return;
            }

            const padding = 70;
            const max = Math.max(1, ...values);
            const availableWidth = canvas.width - padding * 2;
            const slot = availableWidth / data.labels.length;
            const barWidth = Math.max(12, Math.min(70, slot * 0.65));
            const chartHeight = canvas.height - padding * 2;

            context.strokeStyle = "#6b7280";
            context.beginPath();
            context.moveTo(padding, padding / 2);
            context.lineTo(padding, canvas.height - padding);
            context.lineTo(canvas.width - padding / 2, canvas.height - padding);
            context.stroke();

            data.labels.forEach((label, index) => {
                const value = Number(values[index] || 0);
                const height = (value / max) * chartHeight;
                const x = padding + slot * index + (slot - barWidth) / 2;
                const y = canvas.height - padding - height;
                context.fillStyle = colors[index % colors.length];
                context.fillRect(x, y, barWidth, height);
                context.fillStyle = "#111827";
                context.fillText(String(value), x, Math.max(20, y - 8));
                const shortLabel = String(label).slice(0, 18);
                context.save();
                context.translate(x + barWidth / 2, canvas.height - padding + 12);
                context.rotate(-Math.PI / 5);
                context.fillText(shortLabel, 0, 0);
                context.restore();
            });
        }

        selector.addEventListener("change", event => render(event.target.value));
        render(selector.value);
    });
</script>
{% endblock %}
